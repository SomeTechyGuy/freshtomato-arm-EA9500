name: Build FreshTomato ea9400-128e

on:
  workflow_dispatch:

jobs:
  docker:
    name: Build or restore Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image_name.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure nss_wrapper is executable
        run: chmod +x docker/nss_wrapper

      - name: Set lowercase image name
        id: image_name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/freshtomato-builder:" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/${OWNER}/freshtomato-builder" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push builder image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image_name.outputs.base }}:latest
            ${{ steps.image_name.outputs.base }}:${{ hashFiles('docker/Dockerfile', 'docker/nss_wrapper') }}
          cache-from: type=registry,ref=${{ steps.image_name.outputs.base }}:cache
          cache-to:   type=registry,ref=${{ steps.image_name.outputs.base }}:cache,mode=max

  firmware:
    name: Compile ea9400-128e firmware
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image_name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/freshtomato-builder:${{ hashFiles('docker/Dockerfile', 'docker/nss_wrapper') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull builder image
        run: docker pull ${{ steps.image_name.outputs.image }}

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            release/src-rt-7.14.114.x/src/router
            release/src-rt-7.14.114.x/src/linux
          key: build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-${{ github.ref_name }}-
            build-

      - name: Build ea9400-128e firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/ws \
            --user "$(id -u):$(id -g)" \
            ${{ steps.image_name.outputs.image }} \
            make -j$(nproc) -C /ws/release/src-rt-7.14.114.x/src ea9400-128e

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea9400-128e-${{ github.sha }}
          path: |
            release/src-rt-7.14.114.x/src/image/*.trx
            release/src-rt-7.14.114.x/src/image/*.bin
          if-no-files-found: warn
          retention-days: 30
