name: Build FreshTomato ea9400-128e

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ea9400-128e firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure nss_wrapper is executable
        run: chmod +x docker/nss_wrapper

      - name: Set image tag
        id: meta
        run: echo "tag=freshtomato:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ea9400-128e firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/ws \
            -v "${{ github.workspace }}/.ccache":/ws/.ccache \
            -e CCACHE_DIR=/ws/.ccache \
            --user "$(id -u):$(id -g)" \
            ${{ steps.meta.outputs.tag }} \
            make -C /ws/release/src-rt-7.14.114.x/src ea9400-128e

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea9400-128e-${{ github.sha }}
          path: |
            release/src-rt-7.14.114.x/src/image/*.trx
            release/src-rt-7.14.114.x/src/image/*.bin
          if-no-files-found: warn
          retention-days: 1
